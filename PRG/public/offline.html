<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - BLAST Protocol</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0a, #1a0a2e);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #4B0082, #FF00FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #aaa;
      max-width: 400px;
      line-height: 1.6;
    }
    .retry-btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #4B0082;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .retry-btn:hover {
      background: #6a0dad;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Connection Lost</h1>
  <p>The BLAST Protocol requires network access to initialize. Please check your connection and try again.</p>
  <button class="retry-btn" onclick="location.reload()">Retry Connection</button>
</body>
</html>
